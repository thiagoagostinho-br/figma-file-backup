<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        font-size: 12px;
        color: #1a1a1a;
        width: 320px;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        color: #555;
        line-height: 1.4;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 12px;
        font-family: inherit;
      }
      label.fieldLabel {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      button {
        background: #18a0fb;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        width: 100%;
        font-size: 12px;
        margin-top: 10px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin-top: 12px;
        color: #555;
        min-height: 16px;
      }
      .status.error {
        color: #d32f2f;
      }
      .hint {
        color: #888;
        font-size: 11px;
        margin-top: 4px;
      }
      .hint.error {
        color: #d32f2f;
      }
      .fileList {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 8px 0;
      }
      .fileList label,
      .selectAllRow {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        font-size: 12px;
      }
      .selectAllRow {
        font-weight: 600;
        border-bottom: 1px solid #eee;
        padding-bottom: 6px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <h2>Figma File Backup</h2>

    <div id="setup">
      <div id="detectedFileBox" class="hint" style="display: none"></div>

      <div id="manualUrlWrap" style="display: none">
        <label class="fieldLabel" for="fileUrlInput">Link do arquivo atual</label>
        <input id="fileUrlInput" type="text" placeholder="Cole aqui: https://figma.com/design/..." />
        <div class="hint">No Figma: menu do arquivo &rarr; Copy link (ou Cmd/Ctrl+L).</div>
      </div>

      <button id="findFilesBtn">Buscar arquivos</button>
      <div id="discoveryStatus" class="status"></div>
    </div>

    <div id="fileListWrap" style="display: none">
      <div class="fileList">
        <label class="selectAllRow">
          <input type="checkbox" id="selectAll" /> Selecionar todos
        </label>
        <div id="fileList"></div>
      </div>
      <button id="startBackup" disabled>Iniciar Backup</button>
      <button id="cancelBackup" style="background: #888; display: none">Cancelar</button>
      <div id="backupStatus" class="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
