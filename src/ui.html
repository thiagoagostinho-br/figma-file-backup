<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: Inter, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        font-size: 12px;
        color: #1a1a1a;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        color: #555;
        line-height: 1.4;
      }
      button {
        background: #18a0fb;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        width: 100%;
        font-size: 12px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
        color: #555;
        min-height: 16px;
      }
      #status.error {
        color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <h2>Backup de Arquivo</h2>
    <p>
      Exporta a estrutura completa do arquivo atual (paginas, camadas e
      metadados) para um arquivo JSON local.
    </p>
    <button id="start">Iniciar Backup</button>
    <div id="status"></div>

    <script>
      const startBtn = document.getElementById("start");
      const status = document.getElementById("status");

      startBtn.onclick = () => {
        startBtn.disabled = true;
        status.className = "";
        status.textContent = "Gerando backup...";
        parent.postMessage({ pluginMessage: { type: "start-backup" } }, "*");
      };

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "backup-ready") {
          const blob = new Blob([JSON.stringify(msg.payload, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const safeName = (msg.payload.fileName || "figma-backup").replace(
            /[^a-z0-9-_]+/gi,
            "_"
          );
          a.href = url;
          a.download = `${safeName}-${Date.now()}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          status.textContent = "Backup concluido! Verifique seus downloads.";
          startBtn.disabled = false;
        }

        if (msg.type === "backup-error") {
          status.className = "error";
          status.textContent = `Erro: ${msg.message}`;
          startBtn.disabled = false;
        }
      };
    </script>
  </body>
</html>
